name: OBS isolated source and security CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  obs-source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove exact source and preserve the dedicated runner workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git diff --exit-code "$BASE_SHA" HEAD -- .github/workflows/nabeel-integration-ci.yml
      - name: Validate syntax without starting media services
        run: |
          bash -n docs/scripts/nabeel-postprocess.sh
          python -c 'from pathlib import Path; [compile(p.read_text(), str(p), "exec") for p in (Path("docs/scripts/nabeel-obs-bootstrap.py"), Path("docs/scripts/nabeel-staging-certify.py"), Path("tests/test_obs_source.py"))]'
      - name: Test configuration, fail-closed decisions and export provenance in isolation
        run: python -m unittest discover -s tests -v
      - name: Reject tracked source changes during validation
        run: git diff --exit-code

  obs-source-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked history and complete effective source
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 --exit-code 1 .
